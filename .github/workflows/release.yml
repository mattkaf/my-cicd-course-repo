name: Release Build

on:
    push:
        tags:
        - 'v*.*.*'

jobs:
    release-build:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install pytest and bandit
              run: pip install pytest bandit

            - name: Run tests
              run: pytest

            - name: Run security scan
              run: bandit -r security_examples -f txt

            - name: Generate release build report
              run: python scripts/generate_report.py

            - name: Upload release artifact
              uses: actions/upload-artifact@v4
              with:
                  name: release-build-report
                  path: build/build_report.txt