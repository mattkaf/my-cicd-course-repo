name: Security Scan

on:
  push:
    branches: [ main, week-5-security ]
  pull_request:
    branches: [ main ]

jobs:
    bandit-scan:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Install Bandit
              run: pip install bandit

            - name: Run Bandit security scan
              run: bandit -r security_examples -f txt
              